<div class="card rounded-3 border-0" style="width: 17.5rem; height: 24rem; margin: 0 auto;">
  <p-galleria [value]="galleryImages"
              [numVisible]="5"
              [circular]="true"
              [showItemNavigators]="true"
              [showThumbnails]="false"
              [containerStyle]="{ 'width': '100%', 'height': '12.5rem'}"
              class="card-img-top shadow-sm rounded-3 overflow-hidden">
    <ng-template #item let-item>
      <a [routerLink]="['/house', house.id]" style="display: block; width: 100%; height: 100%;">
        <img [src]="getImageUrl(item.itemImageSrc)" style="width: 100%; height: 12.5rem; object-fit: cover;" />
      </a>
    </ng-template>
  </p-galleria>

  <a [routerLink]="['/house', house.id]" style="text-decoration: none;">
    <div class="card-body d-flex flex-column" style="height: 11.5rem;">
      <h5 class="card-title text-dark text-truncate mb-1">{{house.title}}</h5>
      <p class="card-text text-muted mb-2 text-truncate">{{truncateText(house.location, 40)}}</p>
      <div class="d-flex flex-wrap gap-3 mb-2">
        <div class="d-flex align-items-center">
          <fa-icon [icon]="faUsers" class="text-secondary me-1" style="{'font-size': '0.9rem'}"></fa-icon>
          <span class="text-muted small">{{house.guests}}</span>
        </div>
        <div class="d-flex align-items-center">
          <fa-icon [icon]="faHome" class="text-secondary me-1" style="{'font-size': '0.9rem'}"></fa-icon>
          <span class="text-muted small">{{house.bedrooms}}</span>
        </div>
        <div class="d-flex align-items-center">
          <fa-icon [icon]="faBed" class="text-secondary me-1" style="{'font-size': '0.9rem'}"></fa-icon>
          <span class="text-muted small">{{house.beds}}</span>
        </div>
        <div class="d-flex align-items-center">
          <fa-icon [icon]="faBath" class="text-secondary me-1" style="{'font-size': '0.9rem'}"></fa-icon>
          <span class="text-muted small">{{house.bathrooms}}</span>
        </div>
      </div>
      <div class="mt-auto">
        <p class="card-text text-muted mb-0">
          <span class="text-dark fw-bold">{{house.price | currency:house.currency:'symbol'}}</span> / night
        </p>
      </div>
    </div>
  </a>
</div>
