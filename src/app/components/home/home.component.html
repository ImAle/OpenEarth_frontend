<app-search-bar/>
<app-filter/>

<div class="container d-flex flex-row justify-content-around">
  @for (house of houses; track house.id) {
    <app-card [house]="house"/>
  }
</div>

<app-map (houseSelected)="onHouseSelected($event)" [isInteractive]="false"/>
@if (selectedHouse) {
  <app-house-side-modal [house]="selectedHouse" (close)="selectedHouse = null"/>
}
