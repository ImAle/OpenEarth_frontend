<div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden; max-width: 350px; transition: transform 0.3s, box-shadow 0.3s;" onmouseover="this.style.transform='translateY(-5px)'; this.style.boxShadow='0 10px 20px rgba(0,0,0,0.1)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 6px rgba(0,0,0,0.06)';">
  <!-- Gallery without borders, full width -->
  <div class="position-relative">
    <p-galleria [value]="galleryImages"
                [numVisible]="5"
                [circular]="true"
                [showItemNavigators]="true"
                [showThumbnails]="false"
                [containerStyle]="{ 'width': '100%', 'height': '200px'}"
                class="w-100 overflow-hidden">
      <ng-template #item let-item>
        <div style="width: 100%; height: 200px;">
          <img [src]="getImageUrl(item.itemImageSrc)" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
      </ng-template>
    </p-galleria>

    <!-- Wishlist heart icon with better styling -->
    <span class="position-absolute top-0 end-0 p-2" style="z-index: 10;">
      <i class="bi bi-heart" style="font-size: 1.4rem; color: white; filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5)); cursor: pointer; transition: all 0.2s;" onmouseover="this.classList.replace('bi-heart', 'bi-heart-fill'); this.style.color='#ff5a5f';" onmouseout="this.classList.replace('bi-heart-fill', 'bi-heart'); this.style.color='white';"></i>
    </span>
  </div>

  <!-- Card body with improved spacing and typography -->
  <div class="card-body p-3">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h5 class="card-title mb-0" style="font-size: 1.1rem; font-weight: 600; color: #2c3e50; line-height: 1.3;">{{house.title}}</h5>
    </div>

    <p class="card-text mb-3" style="font-size: 1.2rem; font-weight: 700; color: #2c3e50;">{{house.price | currency:house.currency}}</p>

    <div class="d-flex justify-content-between align-items-center">
      <a [routerLink]="['/house', house.id]" class="text-decoration-none w-100">
        <button class="btn btn-primary w-100" style="border-radius: 6px; background-color: #3498db; border: none; padding: 8px 0; font-weight: 500; letter-spacing: 0.3px; transition: all 0.2s;" onmouseover="this.style.backgroundColor='#2980b9';" onmouseout="this.style.backgroundColor='#3498db';">Visit Property</button>
      </a>
    </div>
  </div>
</div>
