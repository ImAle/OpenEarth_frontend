<div class="card border-0" >
  <div class="card-body p-3">
    <p-galleria [value]="galleryImages"
                [numVisible]="5"
                [circular]="true"
                [showItemNavigators]="true"
                [showThumbnails]="false"
                [containerStyle]="{ 'max-width': '100%', 'height': '12.5rem'}"
                class="card-img-top shadow-sm rounded-3 overflow-hidden">
      <ng-template #item let-item>
        <a [routerLink]="['/house', house.id]" style="display: block; width: 100%; height: 100%;">
          <img [src]="getImageUrl(item.itemImageSrc)" style="width: 100%; height: 12.5rem; object-fit: cover;" />
        </a>
      </ng-template>
    </p-galleria>

    <h5 class="card-title mb-2" style="font-size: 1.2rem; font-weight: bold;">{{house.title}}</h5>
    <p class="card-text mb-1" style="font-size: 1rem; font-weight: bold;">{{house.price | currency:house.currency}}</p>
    <a [routerLink]="['/house', house.id]">
      <button class="btn btn-primary" style="border-radius: 3px;">Visit</button>
    </a>
    <span class="position-absolute top-0 end-0 p-2" style="font-size: 1.5rem; cursor: pointer;">
            <i class="bi bi-heart-fill"></i> </span>
  </div>
</div>
