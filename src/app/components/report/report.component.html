<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{width: '450px'}"
  header="Report user"
  (onHide)="close()">

  <div class="report-form">
    <p>Please tell us why you are reporting this user:</p>

    <div class="field">
      <textarea
        [(ngModel)]="reportComment"
        rows="5"
        cols="30"
        placeholder="Describe the problem you experienced with this user..."
        class="p-inputtextarea p-inputtext p-component p-element"
        style="width: 100%; resize: vertical;">
      </textarea>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button pButton class="p-button-danger" (click)="close()">Cancel</button>
    <button
      pButton
      [disabled]="!reportComment.trim() || submitting"
      (click)="submit()"
      class="p-button-primary">
      Send Report
    </button>
  </ng-template>
</p-dialog>
