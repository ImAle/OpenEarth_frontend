<app-header/>

<div class="container" style="padding-top: 4.5rem; text-align: center; overflow: hidden;">
  <!-- Background Image (full screen) -->
  <div class="position-fixed top-0 left-0 w-100 h-100"
       style="background: url('/errorBackground.png') no-repeat center center;
              background-size: 80%;
              z-index: -1;
              top: 56px;">
  </div>

  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body p-5">
          <!-- Error icon -->
          <div class="text-center mb-4">
            <i class="fas fa-{{errorInfo.icon}}" style="font-size: 5rem; color: #dc3545;"></i>
          </div>

          <!-- Error code and title -->
          <h1 class="display-1 fw-bold text-danger mb-3">{{errorInfo.code}}</h1>
          <h2 class="mb-4">{{errorInfo.title}}</h2>

          <!-- Error message -->
          <p class="lead mb-3">{{errorInfo.message}}</p>

          <!-- Suggestion if available -->
          @if (errorInfo.suggestion) {
            <p class="mb-4">{{errorInfo.suggestion}}</p>
          }

          <!-- Navigation buttons -->
          <div class="mt-5">
            <button class="btn btn-primary me-3" (click)="goToHome()">
              <fa-icon [icon]="faHome" class="me-2"></fa-icon>Go to Home
            </button>
            <button class="btn btn-outline-secondary" (click)="goBack()">
              <fa-icon [icon]="faArrowLeft" class="me-2"></fa-icon>Go Back
            </button>
          </div>
        </div>
      </div>

      <!-- Timer for automatic redirection (optional) -->
      @if (errorCode === 503 || errorCode === 502 || errorCode === 504) {
        <div class="alert alert-info mt-4" role="alert">
          <fa-icon [icon]="faInfoCircle" class="me-2"></fa-icon>
          You will be automatically redirected to the home page in a few seconds...
        </div>
      }
    </div>
  </div>
</div>
