worker_processes 1;
events {
  worker_connections 1024;
}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  # Añadir tipos MIME para .avif
  types {
    image/avif                   avif;
  }

  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Importante: Primero manejamos las solicitudes API antes de las rutas estáticas
    # Configuración para la API - todas las rutas /api/ van al backend
    location /api/ {
      proxy_pass http://spring-app:8080/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Configuración para WebSockets (si los usas con STOMP)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Aumentar timeouts para evitar problemas con imágenes grandes
      proxy_connect_timeout 120s;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;

      # Importante: asegurarnos de que no busque este archivo localmente
      proxy_intercept_errors off;
    }

    # Rutas específicas para la aplicación Angular
    location / {
      try_files $uri $uri/ /index.html =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Configuración para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1d;
      add_header Cache-Control "public, max-age=86400";

      # Importante: No intentar servir archivos con prefijo /api/
      if ($uri ~* ^/api/) {
        return 404;
      }
    }

    # Para el caso específico de /home
    location = /home {
      try_files /index.html =404;
    }

    # Configuración para evitar que Nginx sirva archivos ocultos
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    error_page 404 /index.html;

    # Configuración para redireccionar errores a Angular
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
