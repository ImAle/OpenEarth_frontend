worker_processes 1;
events {
  worker_connections 1024;
}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  # Add MIME types for .avif
  types {
    image/avif                   avif;
  }

  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Specific configuration for WebSockets
    location /api/ws/chat {
      proxy_pass http://spring-app:8080/ws/chat;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Essential configuration for WebSockets
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Longer timeouts for WebSockets
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
    }

    # API configuration - all /api/ routes go to the backend
    location /api/ {
      proxy_pass http://spring-app:8080/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Preserve the Authorization header
      proxy_set_header Authorization $http_authorization;
      proxy_pass_header Authorization;

      # Allow OPTIONS for CORS preflight
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range,Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
      }

      # Increase timeouts to avoid issues with large images
      proxy_connect_timeout 120s;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;

      # Important: make sure it doesn't try to serve this file locally
      proxy_intercept_errors off;
    }

    # Specific routes for the Angular app
    location / {
      try_files $uri $uri/ /index.html =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets configuration
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1d;
      add_header Cache-Control "public, max-age=86400";

      # Important: Do not try to serve files with /api/ prefix
      if ($uri ~* ^/api/) {
        return 404;
      }
    }

    # Specific case for /home
    location = /home {
      try_files /index.html =404;
    }

    # Prevent Nginx from serving hidden files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    error_page 404 /index.html;

    # Configuration to redirect errors to Angular
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
